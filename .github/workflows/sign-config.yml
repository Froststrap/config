name: Sign Remote Data Config

on:
  push:
    paths:
      - 'Data.json'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create Private Key Files
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.REMOTE_DATA_PRIVATE_KEY }}
          P256_PRIVATE_KEY: ${{ secrets.REMOTE_DATA_P256_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ED25519_PRIVATE_KEY" > private_key.pem
          printf '%s\n' "$P256_PRIVATE_KEY" > p256_private_key.pem

      - name: Generate Signatures
        run: |
          openssl pkeyutl \
            -sign \
            -rawin \
            -inkey private_key.pem \
            -in Data.json \
            -out Data.json.sig

          openssl dgst \
            -sha256 \
            -sign p256_private_key.pem \
            -out Data.json.p256.sig \
            Data.json

      - name: Verify Generated Signatures
        run: |
          openssl pkeyutl \
            -verify \
            -rawin \
            -pubin \
            -inkey froststrap-config-public.pem \
            -sigfile Data.json.sig \
            -in Data.json

          openssl dgst \
            -sha256 \
            -verify keys/froststrap-config-p256-public.pem \
            -signature Data.json.p256.sig \
            Data.json

      - name: Cleanup Private Key Files
        if: always()
        run: rm -f private_key.pem p256_private_key.pem

      - name: Commit and Push Signatures
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data.json.sig Data.json.p256.sig
          git commit -m "chore: update Data.json signatures [skip ci]" || exit 0
          git push
